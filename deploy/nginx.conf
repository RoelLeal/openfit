# Static hosting for the PWA. Works from the root or, with `location /openfit/`, from a sub-path.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Hashed assets can be cached forever; everything else must revalidate so
    # the service worker sees new versions right away.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
