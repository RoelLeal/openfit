<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- CSP -->
    <meta name="referrer" content="no-referrer" />
    <title>OpenFit</title>
    <meta
      name="description"
      content="Track food, calories, macros and weight. Local-first and private: no account, no server."
    />
    <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0f0e" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="OpenFit" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <!-- Applies the cached theme before first paint to avoid a flash. -->
    <script src="./theme.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>OpenFit needs JavaScript. / OpenFit necesita JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
